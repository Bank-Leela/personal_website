<!DOCTYPE html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The arena floor, which frames every court; keep in sync with --floor in src/index.css. -->
    <meta name="theme-color" content="#0c0c0d" />

    <!--
      Resolve the court before first paint. Without this the document renders
      one frame of the grey mat and then swaps, which reads as a flash.
    -->
    <script>
      (function () {
        var court = "grey";
        try {
          var stored = localStorage.getItem("court");
          if (stored === "green" || stored === "red") court = stored;
        } catch (e) {
          /* storage unavailable; the grey mat is laid */
        }
        document.documentElement.dataset.court = court;
      })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />

      The .ico tops out at 48px, so the home-screen icon and the link preview
